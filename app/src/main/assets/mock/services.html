<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prenotami MOCK — Servizi</title>
<style>
  body { font-family: sans-serif; background:#e9e9e9; margin:0; padding:16px; }
  h2 { text-align:center; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th,td { padding:10px; border-bottom:1px solid #ddd; font-size:14px; text-align:left; }
  .book { display:inline-block; background:#0b57a4; color:#fff; padding:8px 18px;
          text-decoration:none; border-radius:3px; font-weight:bold; }
  #modal { display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%);
           width:80%; max-width:520px; background:#fff; border-top:6px solid #2aa3d4;
           box-shadow:0 4px 24px rgba(0,0,0,.4); padding:22px; }
  #modal button.confirm { background:#3aa0dd; color:#fff; border:0; padding:10px 26px;
           border-radius:4px; float:right; font-size:15px; }
</style>
</head>
<body>
  <!-- Mock of the real services list. The citizenship row is "sold out" for the first
       N clicks (localStorage counter, default 2; ?sold=N to change), then opens the booking
       page. ?redir=N first sends N clicks to UserArea.html (seen live on 25 Nov). Reset the counter with ?reset=<new token>. -->
  <h2>Services provided by the Embassy/Consulate (MOCK)</h2>
  <table>
    <tr><th>Type</th><th>Service</th><th>Description</th><th>Booking</th></tr>
    <tr>
      <td>CITIZENSHIP</td><td>Citizenship by descent</td><td>Citizenship by Birth</td>
      <td><a class="book" href="/Services/Booking/101" onclick="book();return false;">BOOK</a></td>
    </tr>
    <tr>
      <td>AIRE AND CIVIL STATUS</td><td>Registry office</td><td>Marriage banns</td>
      <td><a class="book" href="/Services/Booking/200" onclick="showSold();return false;">BOOK</a></td>
    </tr>
  </table>

  <div id="modal" class="jconfirm-box">
    <p>All appointments for this service are currently booked. New appointments will be released soon.</p>
    <button class="confirm" onclick="document.getElementById('modal').style.display='none'">OK</button>
  </div>

<script>
  var qs = new URLSearchParams(location.search);
  // ?reset=<token> resets once per token (retry waves reload the same URL).
  if (qs.get('reset') && localStorage.getItem('mockResetTok') !== qs.get('reset')) {
    localStorage.setItem('mockResetTok', qs.get('reset'));
    localStorage.removeItem('mockClicks');
    localStorage.setItem('mockSold', qs.get('sold')||2);
    localStorage.setItem('mockRedir', qs.get('redir')||0);
  }
  function showSold(){ document.getElementById('modal').style.display='block'; }
  function book(){
    var n = +(localStorage.getItem('mockClicks')||0) + 1;
    localStorage.setItem('mockClicks', n);
    var sold = +(localStorage.getItem('mockSold')||2), redir = +(localStorage.getItem('mockRedir')||0);
    if (n <= redir) { location.href = 'UserArea.html'; return; }   // like 25 Nov: click -> /UserArea
    if (n <= sold + redir) showSold(); else location.href = 'Services/Booking/101.html';
  }
</script>
</body>
</html>
