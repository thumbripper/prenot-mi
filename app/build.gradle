plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.szurgot.prenotasniper'
    compileSdk 36

    defaultConfig {
        applicationId "com.szurgot.prenotasniper"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "10"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Name the APK with the version, e.g. prenot-mi-v8-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "prenot-mi-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
